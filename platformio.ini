; Matrixinator: show an LED matrix on a touch screen. It answers like WLED (JSON API + DDP),
; so Signinator can send it the same frames it sends the LED sign.
;
; Board: Guition ESP32-S3-4848S040 (4" 480x480 ST7701 RGB panel, GT911 touch, 16 MB flash, 8 MB PSRAM).
; Display setup copied from openHASP's working config for this board (Arduino_GFX 1.4.7, Arduino core 2.0.x).

[platformio]
default_envs = esp32-s3-4848s040

[env:esp32-s3-4848s040]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
lib_deps =
    moononournation/GFX Library for Arduino@1.4.7
    bblanchon/ArduinoJson@7.2.1
build_flags =
    -D BOARD_HAS_PSRAM
    -D FW_VERSION=\"${sysenv.FW_VERSION}\"
    -D CORE_DEBUG_LEVEL=0

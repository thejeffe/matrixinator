name: Build

# Every push builds the firmware (download it from the run's artifacts).
# A tag like v1.2.3 also makes a GitHub Release with the binaries, which Lickety Split picks up:
#   matrixinator-4848s040-factory.bin  full image for a USB flash at offset 0 (bootloader + partitions + app)
#   matrixinator-4848s040-ota.bin      app only, for updates over Wi-Fi (POST /update)
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio==6.1.16 esptool==4.8.1

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-${GITHUB_SHA::7}"; fi
          echo "FW_VERSION=$v" >> "$GITHUB_ENV"

      - name: Build
        run: pio run -e esp32-s3-4848s040

      - name: Package
        run: |
          B=.pio/build/esp32-s3-4848s040
          BOOT_APP0=~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin
          mkdir -p out
          esptool.py --chip esp32s3 merge_bin -o out/matrixinator-4848s040-factory.bin \
            --flash_mode keep --flash_freq keep --flash_size 16MB \
            0x0 $B/bootloader.bin 0x8000 $B/partitions.bin 0xe000 $BOOT_APP0 0x10000 $B/firmware.bin
          cp $B/firmware.bin out/matrixinator-4848s040-ota.bin
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: matrixinator-${{ env.FW_VERSION }}
          path: out/*.bin

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.bin
          make_latest: true
          generate_release_notes: true
